[build-system]
# 1.27 is the first hatchling that reads the PEP 639 license fields below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "httplib"
version = "0.1.0.dev0"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "HTTP plumbing over the standard library: proxy resolution with credentials and prefix gateways, Netscape cookie jars, OS trust-store TLS, URL hooks, and an optional requests session"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    # The system's proxy configuration (WinHTTP, macOS, libproxy/desktops; PAC
    # and WPAD) is the default route when no proxy variable is set.
    "proxylib>=1.0,<2",
    # The OS verifies certificates (CryptoAPI, Security framework); truststore
    # needs Python 3.10, and 3.9 keeps the stdlib's default context.
    'truststore>=0.10.0,<0.11; python_version >= "3.10"',
]

[project.optional-dependencies]
# requests backs httplib.session and httplib.fetch only, imported when a
# session is built; importing httplib never needs it. urllib3 comes with it.
session = ["requests>=2.25,<3"]
# A JavaScript engine for PAC scripts proxylib evaluates itself (Linux without
# libproxy); Windows and macOS evaluate PAC in the OS.
pac = ["proxylib[quickjs]>=1.0,<2"]
# The tests exercise every extra, so dev refers to them rather than repeating
# their ranges.
dev = ["httplib[session]", "build", "pytest", "black", "mypy<2", "types-requests"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/httplib"
Documentation = "https://jose-pr.github.io/httplib/"
Issues = "https://github.com/jose-pr/httplib/issues"

[tool.hatch.build.targets.sdist]
# "/.*" is dotfiles only; it does not match `*.local.*`, which needs its own
# pattern. The root AGENTS.md orients a contributor and is not shipped.
exclude = ["/.*", "*.local.*", "/AGENTS.md", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/httplib"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "httplib/README.md"

[tool.black]
target-version = ["py39"]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings are errors. An exception would be listed here as narrowly as the
# warning's own text, with the reason it is tolerated; there are none.
filterwarnings = ["error"]
