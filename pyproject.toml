[build-system]
# 1.27 is the first hatchling that reads the PEP 639 license fields below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "syshttp"
version = "0.1.0.dev17"
authors = [{ name = "jose-pr", email = "jose-pr@coqui.dev" }]
description = "HTTP plumbing that follows the system: the system proxy (PAC, WPAD) and the OS certificate verifier by default, proxy credentials and prefix gateways, Netscape cookie jars, OS trust-store TLS, URL hooks, and an optional requests session"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
# Every floor is the newest release that still supports Python 3.9: the one
# version line tested, on every supported Python.
dependencies = [
    # The system's proxy configuration (WinHTTP, macOS, libproxy/desktops; PAC
    # and WPAD) is the default route when no proxy variable is set.
    "proxylib>=2.0.2,<3",
    # The system's TLS client: the OS verifies certificates (through
    # truststore on Python 3.10+) and a server asking for a client certificate
    # gets one from the OS store, chosen as a browser would.
    "sslcontext>=2.1.0,<3",
    # Patches requests, urllib, httpx, aiohttp and pip as they are imported, when
    # SYSHTTP_IMPORTPATCH asks for it (syshttp.autopatch, the entry points below).
    "importpatch>=0.2.1,<0.3",
]

[project.entry-points.importpatch]
requests = "syshttp.autopatch"
"urllib.request" = "syshttp.autopatch"
httpx = "syshttp.autopatch"
aiohttp = "syshttp.autopatch"
"pip._vendor.requests" = "syshttp.autopatch"

[project.optional-dependencies]
# requests backs syshttp.session and syshttp.fetch only, imported when a
# session is built; importing syshttp never needs it.
session = [
    # Below 2.32.3 requests has no HTTPAdapter.build_connection_pool_key_attributes,
    # the hook that hands a pool its ssl_context.
    "requests>=2.32.5,<3",
    # urllib3 1.26 raises a bare ValueError for an https IP-literal host; 2.x up
    # to 2.2 leaks the socket of a failed TLS handshake through an https proxy.
    "urllib3>=2.6.3,<3",
]
# A JavaScript engine for PAC scripts proxylib evaluates itself (Linux without
# libproxy); Windows and macOS evaluate PAC in the OS.
pac = ["proxylib[pac]>=2.0.2,<3"]
# The tests exercise every extra, so dev refers to them rather than repeating
# their ranges.
# httpx and aiohttp are what syshttp.autopatch patches; the tests use them.
dev = ["syshttp[session]", "httpx", "aiohttp", "build", "pytest", "black", "mypy<2", "types-requests"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/jose-pr/syshttp"
Documentation = "https://jose-pr.github.io/syshttp/"
Issues = "https://github.com/jose-pr/syshttp/issues"

[tool.hatch.build.targets.sdist]
# "/.*" is dotfiles only; it does not match `*.local.*`, which needs its own
# pattern. The root AGENTS.md orients a contributor and is not shipped.
exclude = ["/.*", "*.local.*", "/AGENTS.md", "CLAUDE*"]

[tool.hatch.build.targets.wheel]
packages = ["src/syshttp"]
exclude = ["*.local.*", "CLAUDE*"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "syshttp/README.md"

[tool.black]
target-version = ["py39"]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Warnings are errors. An exception would be listed here as narrowly as the
# warning's own text, with the reason it is tolerated; there are none.
filterwarnings = ["error"]
